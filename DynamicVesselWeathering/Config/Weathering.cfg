// Dynamic Vessel Weathering - réglages globaux
WEATHERING_CONFIG
{
    TickInterval = 1.0            // secondes (temps réel) entre deux mises à jour d'un vaisseau
    MaxPhysicsDt = 5.0            // pas maximal (s) pour la rentrée et la poussière

    // --- vieillissement spatial (UV / radiations) ---
    UVEnabled = true
    UVRate = 1.0
    UVTimeConstantYears = 4.0     // ~63 % de UVMax après ce temps au soleil, à la distance de Kerbin
    UVMax = 0.6                   // décoloration maximale
    SunlitFractionOnRails = 0.7   // part du temps au soleil supposée en orbite sur rails / déchargé
    AtmosphereUVFactor = 0.1      // l'atmosphère filtre l'essentiel des UV

    // --- rentrée atmosphérique ---
    ReentryEnabled = true
    SootRate = 1.0
    // charge thermique (kelvins au-dessus de la pyrolyse × secondes) donnant ~63 % de carbonisation.
    // 250000 : ~40 % après une rentrée d'orbite basse, ~60 % après un retour lunaire,
    // quasi noir après 4 ou 5 missions. Plus grand = noircit plus lentement.
    AblatorCharLoad = 250000

    // Brûlure de la peinture / des panneaux / du ruban : cinétique d'Arrhenius.
    // ~63 % de dégradation après RefTime secondes à RefTemp ; Ea fixe la sensibilité à la
    // température (100 kJ/mol : vitesse ×10 tous les ~40 K autour de 650 K).
    PaintActivationEnergy = 100000
    PaintRefTemp = 650
    PaintRefTime = 120
    FoilActivationEnergy = 150000
    FoilRefTemp = 700
    FoilRefTime = 120

    // --- poussière de surface ---
    DustEnabled = true
    DustRate = 1.0

    // --- panneaux solaires : 0 = purement visuel, 1 = perte de rendement égale à la décoloration
    SolarPanelDegradation = 0.0

    // sensibilité aux UV par matériau
    MATERIAL { name = Paint       uvRate = 1.0 }
    MATERIAL { name = Steel       uvRate = 0.15 }
    MATERIAL { name = Ablator     uvRate = 0.5 }
    MATERIAL { name = SolarPanel  uvRate = 1.5 }
    MATERIAL { name = Foil        uvRate = 0.3 }

    // couleur (R,G,B) et taux de dépôt de la poussière par corps céleste
    BODY_DUST { name = Kerbin  color = 0.55,0.45,0.33  rate = 0.3 }
    BODY_DUST { name = Mun     color = 0.45,0.45,0.45  rate = 1.0 }
    BODY_DUST { name = Minmus  color = 0.70,0.80,0.75  rate = 0.8 }
    BODY_DUST { name = Duna    color = 0.62,0.33,0.20  rate = 1.2 }
    BODY_DUST { name = Ike     color = 0.42,0.40,0.38  rate = 0.8 }
    BODY_DUST { name = Moho    color = 0.40,0.33,0.28  rate = 0.8 }
    BODY_DUST { name = Eve     color = 0.45,0.30,0.45  rate = 0.4 }
    BODY_DUST { name = Gilly   color = 0.50,0.42,0.36  rate = 0.6 }
    BODY_DUST { name = Dres    color = 0.50,0.48,0.45  rate = 0.8 }
    BODY_DUST { name = Laythe  color = 0.60,0.55,0.45  rate = 0.3 }
    BODY_DUST { name = Vall    color = 0.60,0.65,0.70  rate = 0.5 }
    BODY_DUST { name = Tylo    color = 0.55,0.50,0.45  rate = 0.8 }
    BODY_DUST { name = Bop     color = 0.40,0.33,0.25  rate = 0.7 }
    BODY_DUST { name = Pol     color = 0.70,0.65,0.40  rate = 0.8 }
    BODY_DUST { name = Eeloo   color = 0.80,0.80,0.80  rate = 0.5 }
}
