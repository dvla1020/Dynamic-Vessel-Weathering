// Bluedog Design Bureau : matériaux réels des pièces dont l'aspect l'exige.
// Les boucliers BDB (ModuleAblator) sont déjà détectés en Ablator par le mode Auto.

// Module de commande Apollo : ruban Kapton aluminisé collé sur l'ablatif Avcoat
@PART[bluedog_Apollo_CrewPod,bluedog_Apollo_CrewPod_5crew]:HAS[@MODULE[ModuleWeathering]]:NEEDS[Bluedog_DB]:AFTER[DynamicVesselWeathering]
{
    @MODULE[ModuleWeathering] { %material = Foil }
}
