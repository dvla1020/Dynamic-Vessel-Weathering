// Matériau de surface par pièce : Auto (défaut), Paint, Steel, Ablator, SolarPanel,
// Foil (ruban métallisé sur ablatif, type module de commande Apollo).
// Auto = panneau solaire -> SolarPanel ; moteur à poussée réglable -> Steel ;
//        bouclier ablatif sans équipage -> Ablator ; sinon -> Paint.
//
// Exemple pour des pièces en inox (remplace SEP_* par le préfixe des pièces voulues) :
//
// @PART[SEP_*]:HAS[@MODULE[ModuleWeathering]]:AFTER[DynamicVesselWeathering]
// {
//     @MODULE[ModuleWeathering] { %material = Steel }
// }
